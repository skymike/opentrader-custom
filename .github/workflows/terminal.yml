name: Build Classic Terminal
on:
  push:
    branches: [terminal/classic-dashboard]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --lockfile --frozen-lockfile
      - run: pnpm --filter @opentrader/prisma exec prisma generate --schema src/schema.prisma
      - name: Test terminal and read-only account boundary
        run: node --experimental-strip-types --test packages/bot/src/terminal.node-test.mjs packages/bot/src/terminal-trading.node-test.mjs packages/bot/src/terminal-original.node-test.mjs packages/exchanges/classic-monitor.node-test.mjs packages/exchanges/classic-agents.node-test.mjs packages/exchanges/terminal-assistant.node-test.mjs packages/exchanges/terminal-trading.node-test.mjs packages/exchanges/terminal-v3.node-test.mjs
      - name: Build OpenTrader
        run: pnpm --filter opentrader exec tsup
      - run: python3 -m py_compile scripts/deploy-terminal.py scripts/setup-terminal-ai.py scripts/migrate-terminal-ai.py
      - run: python3 -m unittest discover -s scripts -p 'test_migrate_terminal_ai.py'
      - name: Package release
        run: |
          mkdir -p release/app/frontend/terminal release/app/frontend/assets release/packages/exchanges
          cp -R app/dist release/app/
          cp app/frontend/index.html release/app/frontend/
          cp app/frontend/assets/index-DTKnr6h1.js release/app/frontend/assets/
          cp app/frontend/terminal/* release/app/frontend/terminal/
          cp packages/exchanges/classic-monitor.mjs release/packages/exchanges/
          cp packages/exchanges/classic-agents.mjs release/packages/exchanges/
          cp packages/exchanges/terminal-assistant.mjs release/packages/exchanges/
          cp packages/exchanges/terminal-trading-store.mjs packages/exchanges/terminal-bitget.mjs packages/exchanges/terminal-execution.mjs packages/exchanges/terminal-trader.mjs release/packages/exchanges/
          cp packages/exchanges/terminal-bitget-v3.mjs packages/exchanges/terminal-exchange-router.mjs release/packages/exchanges/
          printf '%s\n' "$GITHUB_SHA" > release/COMMIT
          tar -czf terminal-release.tar.gz -C release .
          cp scripts/deploy-terminal.py deploy-terminal.py
          cp scripts/setup-terminal-ai.py setup-terminal-ai.py
          cp scripts/migrate-terminal-ai.py migrate-terminal-ai.py
      - uses: actions/upload-artifact@v4
        with:
          name: classic-terminal-release
          path: |
            terminal-release.tar.gz
            deploy-terminal.py
            setup-terminal-ai.py
            migrate-terminal-ai.py
          retention-days: 14
